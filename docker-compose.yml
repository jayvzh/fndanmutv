# 完整版：fn-danmutv + 内置 danmu-api
services:
  danmutv:
    build: .
    image: jayvzh/fn-danmutv:latest
    container_name: fn-danmutv
    restart: unless-stopped
    ports:
      - "8017:8017"
    environment:
      - DANMUTV_TOKEN=danmutv
      - DANMUTV_LOG_LEVEL=INFO
      - DANMUTV_PORT=8017
      - TZ=Asia/Shanghai
      - DANMUTV_DANMU_API_URL=http://danmu-api:9321
    volumes:
      - ./data:/data
      # 媒体库，必须可写（弹幕/合并字幕写回视频同目录）
      - ./media:/media:rw
    depends_on:
      - danmu-api

  danmu-api:
    image: logvar/danmu-api:latest
    container_name: danmu-api
    restart: unless-stopped
    ports:
      - "9321:9321"
    environment:
      - TZ=Asia/Shanghai
      - ADMIN_TOKEN=danmutv
    volumes:
      - ./danmu-api-data:/data
