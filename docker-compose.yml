# 完整版：fn-danmutv + 内置 danmu-api
# 用法：docker compose up -d
# 访问：http://<host>:8017  默认 Token：fn-danmutv
services:
  danmutv:
    build: .
    image: jayvzh/fn-danmutv:latest
    container_name: fn-danmutv
    restart: unless-stopped
    ports:
      - "8017:8017"
    environment:
      - DANMUTV_TOKEN=fn-danmutv
      - DANMUTV_LOG_LEVEL=INFO
      - DANMUTV_PORT=8017
      # 完整版通过服务名访问内置 danmu-api
      - DANMUTV_DANMU_API_URL=http://danmu-api:9321
    volumes:
      - ./data:/data
      # 媒体库，必须可写（弹幕/合并字幕写回视频同目录）
      # 将左侧改为你的宿主机媒体路径：
      - ./media:/media:rw
    depends_on:
      - danmu-api

  # 弹幕 API 后端（弹弹 play 兼容）
  danmu-api:
    image: ghcr.io/huangxd-/danmu_api:latest
    container_name: fn-danmu-api
    restart: unless-stopped
    ports:
      - "9321:9321"
    volumes:
      - ./danmu-api-data:/data
